# Patent Examination Guidelines — Source Configuration
# 
# This file defines all known patent examination guideline sources.
# The downloader script uses this to fetch and update source documents.
#
# To disable a jurisdiction or chapter: comment it out with #
# To add a new source: follow the existing format
#
# Format:
#   [jurisdiction.office_code]
#   enabled = true/false
#   
#   [[jurisdiction.office_code.sources]]
#   id = "unique_id"           # Used as filename stem
#   label = "Human Label"      # Display name
#   url = "https://..."        # Download URL
#   format = "pdf" or "html"   # Source format
#   part = "G"                 # Guideline part/chapter identifier
#   chapter = "VII"            # Sub-chapter (optional)
#   task = "inventive_step"    # Maps to rule card task_id
#   enabled = true             # Set false to skip this source

[metadata]
config_version = 1
last_updated = "2026-08-19"
notes = "Comprehensive list of patent examination guideline sources for rule card compilation"

# =============================================================================
# EUROPEAN PATENT OFFICE (EPO)
# =============================================================================
# Source: Guidelines for Examination in the EPO (April 2025 edition)
# Available as PDF per Part and as HTML per chapter
# PDF URL pattern: https://link.epo.org/web/part_X_en.pdf
# HTML URL pattern: https://www.epo.org/en/legal/guidelines-epc/2025/PART_CHAPTER.html

[EP]
enabled = true
office = "EPO"
full_name = "European Patent Office"
base_url_pdf = "https://link.epo.org/web"
base_url_html = "https://www.epo.org/en/legal/guidelines-epc/2025"
edition = "April 2025"
language = "en"
notes = "Updated annually (typically March/April). Check https://www.epo.org/en/legal/guidelines-epc for latest."

